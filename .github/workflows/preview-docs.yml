# Fern hosting disabled — docs are now served via GitHub Pages + Scalar.
# This workflow is kept for reference only and will never trigger.
name: Preview Docs (disabled)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm (Fern token expired — use deploy-pages.yml)'
        required: true

jobs:
  preview:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'yes' }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g fern-api
      - run: fern check
      - env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: fern generate --docs --preview
