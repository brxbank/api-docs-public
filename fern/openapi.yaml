                external_id:
                  type: string
                  description: Unique reversal ID in your system
                  example: rev-unique-id-001
                end_to_end_id:
                  type: string
                  description: EndToEndID of the original received PIX payment
                  example: E35547753202201201450u34sDGd19l2
                reason:
