                        type: string
                        example: Carlos Lima
                      payer_document:
                        type: string
                        example: 11122233344
                      expires_at:
                        type: string
                        example: 2026-04-21T20:10:43-03:00
                      created_at:
                        type: string
                        example: 2026-04-21T23:05:43Z
        '404':
          description: Cash-In not found
  /api/v1/pix/cash-in/{cash_in_id}/cancel:
    post:
      tags:
        - PIX Cash-In
      summary: Cancel Cash-In
      operationId: cancelCashIn
      description: >-
        Cancels a pending PIX charge. Only works for charges with `pending`
        status.


        **Scope:** `pix:cashin:write`
      parameters:
        - name: cash_in_id
          in: path
