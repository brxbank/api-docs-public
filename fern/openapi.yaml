                  example: ["*"]
                status:
                  type: string
                  enum: [active, inactive]
                  description: Webhook status
                  example: active
      responses:
        '200':
          description: Webhook updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      webhook:
                        $ref: '#/components/schemas/Webhook'
        '404':
          description: Webhook not found
    delete:
      tags:
        - Webhooks
      summary: Delete Webhook
      operationId: deleteWebhook
      description: >-
        Removes a registered webhook. Pending deliveries for this webhook will
        be cancelled.


        **WARNING:** This action is irreversible.


        **Scope:** `webhooks:write`
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          schema:
            type: string
            format: uuid
          required: true
          description: Webhook ID
      responses:
        '200':
          description: Webhook deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
                        example: true
        '404':
          description: Webhook not found
  /api/v1/webhooks/{id}/rotate-secret:
    post:
      tags:
        - Webhooks
      summary: Rotate Webhook Secret
      operationId: rotateWebhookSecret
      description: >-
        Generates a new signing secret for the webhook, immediately invalidating
        the old one.


        Use this if your secret was compromised or as a periodic rotation
        practice. After rotation, update your signature verification logic with
        the new secret before deliveries resume.


        **Scope:** `webhooks:write`
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          schema:
            type: string
            format: uuid
          required: true
          description: Webhook ID
      responses:
        '200':
          description: New secret generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      webhook_id:
                        type: string
                        format: uuid
                        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      secret:
                        type: string
                        description: >-
                          New signing secret. Store it securely — it will not be
                          shown again.
                        example: whsec_z9y8x7w6v5u4t3s2r1q0p9o8n7m6l5k4j3i2h1g0f9e8d7c6b5a4
                    required:
                      - webhook_id
                      - secret
        '404':
          description: Webhook not found
  /api/v1/webhooks/deliveries:
    get:
      tags:
        - Webhooks
      summary: List Deliveries
      operationId: listDeliveries
      description: >-
        Lists webhook deliveries for the client. Each delivery shows the event
        type, status, payload, response HTTP status, attempt count, and
        timestamps.


        **Scope:** `webhooks:read`
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: event_type
          in: query
          schema:
            type: string
          description: Filter by event type (e.g. `pix.cash_in.confirmed`)
        - name: status
          in: query
          schema:
            type: string
            enum: [delivered, pending, failed]
          description: Filter by delivery status
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
          description: >-
            Filter deliveries created at or after this instant (RFC 3339, e.g.
            `2026-03-01T00:00:00Z`).
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
          description: >-
            Filter deliveries created at or before this instant (RFC 3339).
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Items per page (1–100, default 20)
          example: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Offset for pagination (default 0)
          example: 0
      responses:
        '200':
          description: List of deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      deliveries:
                        type: array
                        items:
                          $ref: '#/components/schemas/WebhookDelivery'
                      total:
                        type: integer
                        example: 2
                      limit:
                        type: integer
                        example: 20
                      offset:
                        type: integer
                        example: 0
  /api/v1/webhooks/deliveries/{id}:
    get:
      tags:
        - Webhooks
      summary: Get Delivery by ID
      operationId: getDelivery
      description: >-
        Retrieves details of a specific delivery, including the payload sent,
        response HTTP status, and number of attempts.


        **Scope:** `webhooks:read`
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          schema:
            type: string
            format: uuid
          required: true
          description: Delivery ID
      responses:
        '200':
          description: Delivery details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      delivery:
                        $ref: '#/components/schemas/WebhookDelivery'
        '404':
          description: Delivery not found
  /api/v1/webhooks/deliveries/{id}/resend:
    post:
      tags:
        - Webhooks
      summary: Resend Delivery
      operationId: resendDelivery
      description: >-
        Manually re-queues a failed or undelivered webhook delivery.


        Useful when:

        - Your URL was down and is now back online

        - You missed a notification and need to reprocess

        - You want to test integration with real data


        The delivery is re-queued and delivered on the next worker execution.


        **Scope:** `webhooks:write`
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          schema:
            type: string
            format: uuid
          required: true
          description: Delivery ID
      responses:
        '200':
          description: Delivery re-queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: delivery resend requested
        '404':
          description: Delivery not found
  /api/v1/webhooks/activity:
    get:
      tags:
        - Webhooks
      summary: Get Delivery Activity
      operationId: getWebhookActivity
      description: >-
        Returns the most recent webhook deliveries for the client (activity
        feed), newest first. Lighter than the paginated deliveries list — use it
        for a quick health/activity view.


        **Scope:** `webhooks:read`
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Maximum records to return (1–100, default 50)
          example: 50
      responses:
        '200':
          description: Recent delivery activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      activity:
                        type: array
                        items:
                          $ref: '#/components/schemas/WebhookDelivery'
  /api/v1/pix/p2p:
    post:
      tags:
        - P2P
      summary: Transfer
      operationId: p2pTransfer
      description: >-
        Create a P2P transfer. Provide the receiver either by `receiver_account_id`
        (from the [lookup](api:POST/api/v1/pix/p2p/lookup) flow) or by `receiver_pix_key`
        (resolved internally to an account). The response is the orchestrator body
        returned verbatim (flat, no `success`/`data` wrapper).

        **Scope:** `pix:p2p:write`
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - external_id
                - amount
              properties:
                external_id:
                  type: string
                  description: External reference ID
                  example: a9ae38b8-bdfc-4637-909e-af1495f62a4b
                amount:
                  type: string
                  description: Decimal amount to be transfered
                  example: "123.45"
                receiver_account_id:
                  type: string
                  description: >-
                    Account id of the receiver. Obtained from field `account_id`
                    of the [lookup](api:POST/api/v1/pix/p2p/lookup) flow. Provide
                    this OR `receiver_pix_key`.
                  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                receiver_pix_key:
                  type: string
                  description: >-
                    Receiver PIX key. Resolved internally to the receiver account.
                    Provide this OR `receiver_account_id`.
                  example: maria@exemplo.com
                description:
                  type: string
                  description: Description of the transfer
                  example: Paying back lunch
                metadata:
                  type: object
                  additionalProperties: true
                  description: Optional free-form metadata attached to the transfer
                  example:
                    order_id: "order-12345"
      responses:
        '201':
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2PTransferResponse'
        '200':
          description: >-
            Idempotent replay — an in-flight transfer already exists for this
            `external_id`; the same result is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2PTransferResponse'
        '404':
          description: Receiver not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Receiver PIX key not found internally
                  code:
                    type: string
                    example: receiver_not_found
        '409':
          description: Conflict, duplicate external_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Duplicate external_id for this client
                  code:
                    type: string
                    example: DUPLICATE_EXTERNAL_ID
  /api/v1/pix/p2p/lookup:
    post:
      tags:
        - P2P
      summary: Lookup
      operationId: p2pLookup
      description: >-
        Looks up a user's account by their PIX key or account number. Returns an
        envelope `{ "success": true, "data": [ ... ] }`.

        **Scope:** `pix:p2p:read`
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - search_type
                - search_value
              properties:
                search_type:
                  type: string
                  enum: [email, phone, document, account]
                  description: Type of lookup value
                  example: email
                search_value:
                  type: string
                  example: maria@example.com
      responses:
        '200':
          description: Lookup successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/P2PLookup'
        '400':
          description: Invalid search type
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "search_type must be one of: email, phone, document, account"
                  code:
                    type: string
                    example: "VALIDATION_ERROR"

  /api/v1/pix/p2p/authorize:
    post:
      tags:
        - P2P
      summary: Authorize (hold)
      operationId: p2pAuthorize
      description: >-
        Authorize a P2P transfer, placing a hold on the payer that can later be
        captured or cancelled (card-style). The response is the orchestrator body
        returned verbatim (flat, no `success`/`data` wrapper).


        Returns `201` when the authorization resolves synchronously, or `202`
        when it is still being processed asynchronously (poll with
        [Get authorization](api:GET/api/v1/pix/p2p/{id})). A prior `external_id`
        returns `200` with the existing authorization.


        Provide the receiver by `receiver_account_id` or `receiver_pix_key`.

        **Scope:** `pix:p2p:write`
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - external_id
                - amount
              properties:
                external_id:
                  type: string
                  description: External reference ID
                  example: a9ae38b8-bdfc-4637-909e-af1495f62a4b
                amount:
                  type: string
                  description: Decimal amount to authorize
                  example: "123.45"
                receiver_account_id:
                  type: string
                  description: Receiver account id (provide this OR `receiver_pix_key`).
                  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                receiver_pix_key:
                  type: string
                  description: Receiver PIX key, resolved internally (provide this OR `receiver_account_id`).
                  example: maria@exemplo.com
                description:
                  type: string
                  description: Description of the authorization
                  example: Reserva de valor
                ttl_seconds:
                  type: integer
                  format: int64
                  description: >-
                    Time-to-live of the hold in seconds. Default 86400 (24h),
                    minimum 60, maximum 604800 (7 days).
                  example: 3600
                metadata:
                  type: object
                  additionalProperties: true
                  description: Optional free-form metadata
                  example:
                    order_id: "order-12345"
      responses:
        '201':
          description: Authorization created and resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2PAuthorization'
        '202':
          description: >-
            Authorization accepted and being processed asynchronously; poll
            [Get authorization](api:GET/api/v1/pix/p2p/{id}) for the final state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2PAuthorization'
        '200':
          description: Idempotent replay — authorization already exists for this `external_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2PAuthorization'
        '409':
          description: Conflict, duplicate external_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Duplicate external_id for this client
                  code:
                    type: string
                    example: DUPLICATE_EXTERNAL_ID
        '422':
          description: >-
            Business rule rejection (e.g. `INVALID_RECEIVER`,
            `SELF_TRANSFER_NOT_ALLOWED`, `WALLET_KIND_MISMATCH`,
            `ELIGIBILITY_CHECK_FAILED`, `LIMIT_EXCEEDED`, `HOLD_FAILED`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Eligibility check failed
                  code:
                    type: string
                    example: ELIGIBILITY_CHECK_FAILED

  /api/v1/pix/p2p/{id}/capture:
    post:
      tags:
        - P2P
      summary: Capture
      operationId: p2pCapture
      description: >-
        Capture a previously authorized P2P hold, in full or partially. Only an
        authorization in `authorized` state can be captured. The response is the
        orchestrator body returned verbatim (flat).


        Returns `200` when capture resolves synchronously, or `202` when it is
        being processed asynchronously.

        **Scope:** `pix:p2p:write`
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Authorization identifier
          example: a3f1c9d2-7b4e-4f8a-9d3e-2b5c6f7a8e9d
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: string
                  description: >-
                    Amount to capture (two decimals). Omit to capture the full
                    authorized amount. Must not exceed the hold.
                  example: "100.00"
      responses:
        '200':
          description: Captured (or partially captured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2PAuthorization'
        '202':
          description: Capture accepted and being processed asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2PAuthorization'
        '404':
          description: Authorization not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Authorization not found
                  code:
                    type: string
                    example: NOT_FOUND
        '409':
          description: Invalid state — capture is only allowed for `authorized` holds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Authorization is not in a capturable state
                  code:
                    type: string
                    example: INVALID_STATE

  /api/v1/pix/p2p/{id}/cancel:
    post:
      tags:
        - P2P
      summary: Cancel
      operationId: p2pCancel
      description: >-
        Cancel a P2P authorization, releasing the hold. The response is the
        orchestrator body returned verbatim (flat).


        Returns `200` when the cancellation resolves synchronously, or `202`
        when it is being processed asynchronously.

        **Scope:** `pix:p2p:write`
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Authorization identifier
          example: a3f1c9d2-7b4e-4f8a-9d3e-2b5c6f7a8e9d
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional cancellation reason
                  example: Customer gave up
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2PAuthorization'
        '202':
          description: Cancellation accepted and being processed asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2PAuthorization'
        '404':
          description: Authorization not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Authorization not found
                  code:
                    type: string
                    example: NOT_FOUND
        '409':
          description: Invalid state — the authorization cannot be cancelled in its current state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Authorization is not in a cancellable state
                  code:
                    type: string
                    example: INVALID_STATE

  /api/v1/pix/p2p/{id}:
    get:
      tags:
        - P2P
      summary: Get authorization
      operationId: p2pGetAuthorization
      description: >-
        Retrieve the current state of a P2P authorization. The response is the
        orchestrator body returned verbatim (flat).

        **Scope:** `pix:p2p:read`
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Authorization identifier
          example: a3f1c9d2-7b4e-4f8a-9d3e-2b5c6f7a8e9d
      responses:
        '200':
          description: Authorization state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2PAuthorization'
        '404':
          description: Authorization not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Authorization not found
                  code:
                    type: string
                    example: NOT_FOUND

  # ── Accounts ──────────────────────────────────────────────────────────────

  /api/v1/accounts:
    post:
      tags:
        - Accounts
      summary: Create account
      operationId: createAccount
      description: >-
        Create a payment account. If `client_id` is supplied and the identity
        fields (`name`, `document`, `person_type`, `email`) are omitted, they are
        fetched from the client record automatically. If you pass an
        `account_number` (from `POST /api/v1/accounts/reserve`), you must also
        pass the matching `reservation_id`.


        **Authentication:** Bearer token or API Key. **Scope:** `accounts:write`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: Owning client; when set, missing identity fields are pulled from the client record
                  example: "a612b202-6690-4d24-ba35-2e36c8f3c0ce"
                account_type:
                  type: string
                  description: Account type
                  example: "CHECKING"
                person_type:
                  type: string
                  description: Holder person type
                  enum: [individual, company]
                  example: "individual"
                document:
                  type: string
                  description: Holder CPF or CNPJ
                  example: "12345678909"
                name:
                  type: string
                  description: Holder full name
                  example: "João da Silva"
                email:
                  type: string
                  format: email
                  example: "joao@example.com"
                phone:
                  type: string
                  description: Optional holder phone
                  example: "+5511998765432"
                account_number:
                  type: string
                  description: Reserved account number (requires reservation_id)
                  example: "98765432"
                reservation_id:
                  type: string
                  description: Reservation token from POST /api/v1/accounts/reserve — required when account_number is set
                  example: "res_7a3b2c1d4e5f"
      responses:
        '201':
          description: >-
            Account created. Note the nested envelope: the outer object is the
            standard `{success, data}` wrapper; the inner `data` echoes the
            created account plus resolved holder fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: Created account payload (envelope from the account service, passed through)
                    additionalProperties: true
        '400':
          description: Missing required field (name, document, person_type, email, or reservation_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Reservation invalid for this client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Document already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}:
    get:
      tags:
        - Accounts
      summary: Get account
      operationId: getAccount
      description: >-
        Return the status and metadata of one account. Ownership is enforced by
        the `client_id` in your token (owner or parent); an account owned by
        another client returns `404`.


        **Authentication:** Bearer token or API Key. **Scope:** `accounts:read`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Account identifier
          example: "a612b202-6690-4d24-ba35-2e36c8f3c0ce"
      responses:
        '200':
          description: Account status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AccountStatusResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}/activate:
    post:
      tags:
        - Accounts
      summary: Activate account
      operationId: activateAccount
      description: >-
        Transition an account to `active` after KYC approval. Takes no request
        body — the operator identity is derived from your token. Ownership is
        enforced by the `client_id` in your token.


        **Authentication:** Bearer token or API Key. **Scope:** `accounts:activate`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: accountId
          in: path
