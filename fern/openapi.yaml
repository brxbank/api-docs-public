  /api/v1/pix/med/{medId}/respond:
    post:
      tags:
        - MED
      summary: Respond to MED Request
      operationId: respondMed
      description: >-
        Responds to an inbound MED (Special Return Mechanism) request.


        **Possible actions:**

        - `approve` — Approves the return (submits a defense; `reason` is
        **required**)

        - `reject` — Rejects the return (submits a defense; `reason` is
        **required**)

        - `completed` — Marks the MED as completed

        - `cancelled` — Marks the MED as cancelled


        For `approve`/`reject` the request is routed to the defense endpoint and
        `reason` must be provided.


        **Scope:** `pix:med:write`
      security:
        - bearerAuth: []
      parameters:
        - name: medId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: MED request ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [approve, reject, completed, cancelled]
                  description: Action to take on the MED request
                  example: approve
                reason:
                  type: string
                  description: >-
                    Reason for the decision. **Required** when `action` is
                    `approve` or `reject` (used as the defense reason);
                    optional otherwise.
                  example: Return approved after analysis
      responses:
        '200':
          description: >-
            MED response recorded. Returns the updated MED request as a flat
            object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedRefund'
        '400':
          description: Invalid action, or reason missing for approve/reject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: MED request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
