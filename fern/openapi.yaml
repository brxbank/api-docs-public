  /api/v1/pix/qrcode/decode:
    post:
      tags:
        - PIX Cash-Out
      summary: Decode QR Code
      operationId: decodeQRCode
      description: >-
        Decodes a PIX QR Code (static or dynamic).


        **Required field:** `br_code` (EMV payload from QR Code)


        **Participant fields (resolved via BACEN ParticipantesSTR list):**

        - `receiver_participant_name` — Recipient institution name (always
        present)

        **Financial fields (returned when present in CobV QR):**

        - `due_date` — Due date (YYYY-MM-DD)

        - `penalty` — Late fee: `mode` (1=fixed, 2=%), `value`

        - `interest` — Interest: `mode` (1=BRL/day, 2=%/day, 3=%/month,
        4=%/year), `value`

        - `discount` — Discount: `mode` (1-4), `value`, `fixed_dates[]`

        - `rebate` — Rebate: `mode` (1=fixed, 2=%), `value`

        **Optimized flow (Two-Step — RECOMMENDED):**

        1. Decode the QR Code with this API (data is saved in lookup history)

        2. Confirm recipient details with the user

        3. Send the Cash-Out using the `X-Pix-Lookup-E2E: {end_to_end_id}`
        header (WITHOUT sending `br_code` again)

        4. The system uses pre-decoded data, avoiding a duplicate decode call


        **Scope:** `pix:cashout:write`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - br_code
              properties:
                br_code:
                  type: string
                  description: EMV payload from the QR Code
                  example: "00020126580014br.gov.bcb.pix0136263187470001865204000053039865405..."
      responses:
        '200':
          description: >-
            Decoded QR Code data. Flat object (no `data` wrapper). Optional
            fields are omitted when absent from the QR. Withdraw/change
            (`saque`/`troco`) fields appear only for those QR sub-types.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  end_to_end_id:
                    type: string
                    description: Use this in the X-Pix-Lookup-E2E header for the two-step flow
                  qr_code_type:
                    type: string
                    enum: [static, dynamic]
                    example: static
                  pix_key:
                    type: string
                  pix_key_type:
                    type: string
                  amount:
                    type: string
                    description: Amount in BRL (decimal string)
                  tx_id:
                    type: string
                  receiver_name:
                    type: string
                  receiver_trade_name:
                    type: string
                  receiver_document:
                    type: string
                  receiver_person_type:
                    type: string
                  receiver_ispb:
                    type: string
                  receiver_participant_name:
                    type: string
                  receiver_branch:
                    type: string
                  receiver_account:
                    type: string
                  receiver_account_type:
                    type: string
                  amount_change_mode:
                    type: integer
                  withdraw_amount:
                    type: string
                  withdraw_agent_mode:
                    type: integer
                  withdraw_ispb:
                    type: string
                  withdraw_participant_name:
                    type: string
                  change_amount:
                    type: string
                  change_agent_mode:
                    type: integer
                  change_ispb:
                    type: string
                  change_participant_name:
                    type: string
                  due_date:
                    type: string
                    format: date
                  days_after_due:
                    type: integer
                  penalty:
                    type: object
                    properties:
                      mode: { type: integer }
                      value: { type: string }
                  interest:
                    type: object
                    properties:
                      mode: { type: integer }
                      value: { type: string }
                  discount:
                    type: object
                    properties:
                      mode: { type: integer }
                      value: { type: string }
                  rebate:
                    type: object
                    properties:
                      mode: { type: integer }
                      value: { type: string }
        '400':
          description: Invalid or unreadable QR Code
  /api/v1/pix/med:
    get:
      tags:
        - MED
      summary: List MED Requests
      operationId: listMed
      description: Lists all MED requests for the authenticated client. **Scope:** `pix:med:read`
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: >-
            Paginated list of MED requests for the authenticated client.
            Returned as a flat object (no `success` wrapper).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MedRefund'
                  page:
                    type: integer
                    example: 1
                  page_size:
                    type: integer
                    example: 20
                  total:
                    type: integer
                    description: Total count (omitted by the service when not computed)
                    example: 3
    post:
      tags:
        - MED
      summary: Open MED Request
      operationId: openMed
      description: >-
        Opens a new MED (Mecanismo Especial de Devolução — Special Return
        Mechanism) request to recover funds from a fraudulent PIX transaction.


        Use this when your client was a victim of fraud and the original
        transaction was received (cash-in) by the alleged fraudster.
        BACEN will place a precautionary hold on the recipient's account
        while the MED is under analysis.


        **Scope:** `pix:med:write`
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - end_to_end_id
                - amount
                - refund_reason
                - direction
              properties:
                end_to_end_id:
                  type: string
                  description: End-to-end ID of the original PIX transaction to be refunded
                  example: "E54811417202603071234abcdef123456"
                amount:
                  type: string
                  description: Amount to recover in BRL (must not exceed the original transaction amount)
                  example: "500.00"
                refund_reason:
                  type: integer
                  description: >-
                    BACEN refund reason code. Common values:
                    `1` = Fraud, `2` = Operational error, `3` = Customer request.
                    See BACEN MED documentation for full list.
                  example: 1
                direction:
                  type: string
                  enum: [INBOUND, OUTBOUND]
                  description: >-
                    Direction of the refund from your perspective:
                    `OUTBOUND` = you are requesting the refund (payer/victim side —
                    triggers a DICT refund workflow);
                    `INBOUND` = you received a refund request (payee/suspect side).
                  example: "OUTBOUND"
                details:
                  type: string
                  description: Free-text details about the reason for the MED request
                  example: "Cliente relata estelionato via engenharia social"
                client_id:
                  type: string
                  description: Client ID on whose behalf to open the MED (optional — defaults to authenticated client)
                  example: "a612b202-6690-4d24-ba35-2e36c8f3c0ce"
      responses:
        '201':
          description: >-
            MED request opened successfully. Returned as a flat object (no
            `success` wrapper).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedRefund'
        '400':
          description: Invalid request or end_to_end_id not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: MED already exists for this end_to_end_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: DICT adapter unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/pix/med/{medId}:
    get:
      tags:
