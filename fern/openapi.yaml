            type: string
          description: Account ID (optional, uses default account if omitted)
          example: acc-550e8400-e29b-41d4
      responses:
        '200':
          description: >-
            Account balance. Returned as a flat object (no `success`/`data`
            wrapper). All monetary fields are decimal strings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                    example: acc-550e8400-e29b-41d4
                  available_balance:
                    type: string
                    example: "10000.00"
                  blocked_balance:
                    type: string
                    example: "500.00"
                  total_balance:
                    type: string
                    example: "10500.00"
                  currency:
                    type: string
                    example: BRL
                  updated_at:
                    type: string
                    format: date-time
                    example: "2025-01-15T10:00:00Z"
  /api/v1/pix/limits:
    get:
      tags:
        - PIX Limits
      summary: Get Limits
      operationId: getLimits
      description: >-
        Queries PIX transaction limits for the account, grouped by type
        (pix_out, pix_in, ted, boleto) and period (daytime/nighttime).


        **Scope:** `pix:limits:read`
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
          description: Account ID (optional, uses default account if omitted)
          example: acc-550e8400-e29b-41d4
      responses:
        '200':
          description: Account limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  limits:
                    type: object
                    description: Limits grouped by type and period
                  period:
                    type: object
                    properties:
                      daytime:
                        type: string
                        example: "06:00-20:00"
                      nighttime:
                        type: string
                        example: "20:00-06:00"
                  currency:
                    type: string
                    example: BRL
  /api/v1/pix/limits/requests:
    post:
      tags:
        - PIX Limits
      summary: Request Limit Change
      operationId: requestLimitChange
      description: >-
        Creates a request to change a PIX transaction limit. The request remains
        pending until approved or rejected by an administrator.


        **Rules:**

        - Only one pending request per type/period is allowed

        - If one already exists, returns HTTP 409


        **Scope:** `pix:limits:write`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - period
                - requested_amount
              properties:
                type:
                  type: string
                  enum: [pix_in, pix_out, ted, boleto, p2p, total]
                  description: Limit type
                  example: pix_in
                period:
                  type: string
                  enum: [daily, nightly, monthly]
                  description: Time period
                  example: daily
                requested_amount:
                  type: string
                  description: Requested amount (decimal string)
                  example: "500000.00"
                reason:
                  type: string
                  description: Justification for the request (optional)
                  example: Increased e-commerce sales volume
      responses:
        '200':
          description: Limit change request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/LimitRequestResponse'
        '409':
          description: A pending request already exists for this type/period
    get:
      tags:
        - PIX Limits
      summary: List Pending Limit Requests
      operationId: listLimitRequests
      description: >-
        Lists all pending limit change requests for the authenticated account.
        Returns only requests with `pending` status.


        **Scope:** `pix:limits:read`
      responses:
        '200':
          description: List of pending limit requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LimitRequestResponse'
  /api/v1/pix/limits/requests/{limit_request_id}:
    get:
      tags:
        - PIX Limits
      summary: Get Limit Request by ID
      operationId: getLimitRequest
      description: >-
        Retrieves details of a specific limit change request. Returns full data
        including current status (pending, approved, rejected, expired).


        **Scope:** `pix:limits:read`
      parameters:
        - name: limit_request_id
          in: path
          schema:
            type: string
          required: true
          description: Limit request ID
      responses:
        '200':
          description: Limit request details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/LimitRequestResponse'
  /api/v1/pix/cash-in/qrcode:
    post:
      tags:
        - PIX Cash-In
      summary: Create Charge
      operationId: createCashIn
      description: >-
        Creates a PIX charge (Cash-In). Generates a QR Code for the payer
        and waits for the complete processing result.


        **Authentication:** API Key via headers `x-key-id` + `x-secret-key`,
        OR Bearer Token.


        **Scope:** `pix:cashin:write`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - reference
              properties:
                amount:
                  type: string
                  description: Charge amount in BRL (decimal string)
                  example: "150.00"
                reference:
                  type: string
                  description: Your internal reference ID
                  example: order-12345
                description:
                  type: string
                  description: Charge description shown to payer
                  example: Monthly subscription payment
                payer_name:
                  type: string
                  description: Expected payer name (optional)
                  example: John Doe
                payer_document:
                  type: string
                  description: Expected payer document/CPF (optional)
                  example: "12345678901"
                expiration_time:
                  type: integer
                  description: Expiration time in seconds (default 3600)
                  example: 3600
                metadata:
                  type: object
                  description: Metadata for the charge
                due_date:
                  type: string
                  format: date
                  description: Due date for CobV charges (YYYY-MM-DD)
                receiver_address:
                  type: string
                  description: Address of the receiver
                receiver_state:
                  type: string
                  description: State of the receiver
                receiver_postal_code:
                  type: string
                  description: Postal Code of the receiver
                penalty:
                  type: object
                  description: Late fee configuration (CobV only)
                  properties:
                    mode:
                      type: integer
                      description: "1 = fixed amount, 2 = percentage"
                    value:
                      type: number
                interest:
                  type: object
                  description: Daily interest configuration (CobV only)
                  properties:
                    mode:
                      type: integer
                      description: "1 = BRL/day, 2 = %/day, 3 = %/month, 4 = %/year"
                    value:
                      type: number
                discount:
                  type: object
                  description: Early payment discount (CobV only)
                  properties:
                    mode:
                      type: integer
                    value:
                      type: number
                    fixed_dates:
                      type: array
                      items:
                        type: object
                rebate:
                  type: object
                  description: Rebate/abatement (CobV only)
                  properties:
                    mode:
                      type: integer
                    value:
                      type: number
                withdraw_amount:
                  type: string
                  description: Number indicating the withdraw amount
                  example: "123.45"
                withdraw_agent_mode:
                  type: integer
                change_amount:
                  type: string
                  description: Number indicating the change amount
                  example: "123.45"
                change_agent_mode:
                  type: integer
      parameters:
        - name: x-key-id
          in: header
          required: false
          schema:
            type: string
          description: API Key ID (required if not using Bearer Token)
          example: your-api-key-id
        - name: x-secret-key
          in: header
          required: false
          schema:
            type: string
          description: API Key Secret (required if not using Bearer Token)
          example: your-api-key-secret
      responses:
        '200':
          description: >-
            Charge created and processed. The body merges the orchestrator's
            transaction result with QR fields — a flat object (no `data`
            wrapper). The HTTP status mirrors the orchestrator's own status.
            Optional fields are present only when produced by the flow.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conciliation_id:
                    type: string
                    example: e7ab3h05237141509d5c52a280b68b53
                  success:
                    type: boolean
                    example: true
                  transaction_id:
                    type: string
                    example: txn_abc123
                  status:
                    type: string
                    example: pending
                  qr_code:
                    type: string
                    description: EMV payload (BR Code) for the payer
                  qr_code_text:
                    type: string
                  qr_code_image:
                    type: string
                    description: Base64 QR image (when available)
                  access_token:
                    type: string
                    description: >-
                      Identifies the charge (the `/cob/{token}` segment of the
                      BR Code); parameter for the cancel endpoint.
                  payload_url:
                    type: string
                    description: URL served to the payer
                  expires_at:
                    type: string
                    format: date-time
                  jdpi_document_id:
                    type: string
                    example: 29535ed9-cc6a-4d87-994f-634f830362f1
                  message:
                    type: string
                    example: "Cash-in validated successfully"
                  metadata:
                    type: object
                  provider:
                    type: string
                    example: pix
  /api/v1/pix/cash-in/qrcode/static:
    post:
      tags:
        - PIX Cash-In
      summary: Create Static QR Code
      operationId: createStaticQRCode
      description: >-
        Creates a reusable static PIX QR Code (BR Code) for the authenticated
        client. Unlike the dynamic charge, the static QR does not expire and can
        be paid any number of times. All body fields are optional; when `amount`
        is omitted the payer chooses the amount. Response is a flat object
        (no `data` wrapper) proxied from the PIX service.


        **Authentication:** API Key via headers `x-key-id` + `x-secret-key`,
        OR Bearer Token.


        **Scope:** `pix:cashin:write`
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: string
                  description: Fixed amount in BRL (decimal string); omit for payer-defined amount
                  example: "150.00"
                reference:
                  type: string
                  description: >-
                    TxID (EMV field 62-05). Max 25 chars, alphanumeric only
                    (`a-z`, `A-Z`, `0-9`) per BACEN MPI v2.9.0 §2.6.2.
                  example: order12345
                merchant_name:
                  type: string
                  example: Loja Exemplo
                merchant_city:
                  type: string
                  example: Sao Paulo
                description:
                  type: string
                  example: Pagamento avulso
                withdraw_amount:
                  type: string
                  description: PIX Saque amount (decimal string)
                  example: "50.00"
                withdraw_agent_mode:
                  type: integer
                withdraw_ispb:
                  type: string
                change_amount:
                  type: string
                  description: PIX Troco amount (decimal string)
                  example: "10.00"
                change_agent_mode:
                  type: integer
                change_ispb:
                  type: string
      parameters:
        - name: x-key-id
          in: header
          required: false
          schema:
            type: string
          description: API Key ID (required if not using Bearer Token)
          example: your-api-key-id
        - name: x-secret-key
          in: header
          required: false
          schema:
            type: string
          description: API Key Secret (required if not using Bearer Token)
          example: your-api-key-secret
      responses:
        '200':
          description: >-
            Static QR Code created. Flat object proxied verbatim from the PIX
            service.
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr_code:
                    type: string
                    description: EMV payload (BR Code) — reusable, does not expire
                  qr_code_text:
                    type: string
                  qr_code_image:
                    type: string
                    description: Base64 QR image (when available)
                  pix_key:
                    type: string
        '400':
          description: >-
            Invalid `reference` (over 25 chars or contains non-alphanumeric
            characters) or malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/pix/cash-in/{cash_in_id}:
    get:
      tags:
        - PIX Cash-In
